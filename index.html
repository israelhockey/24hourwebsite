<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">

<style>
:root{--ink:#172036;--muted:#5d6580;--acc:#3d5afe;--bg:#f4f5f9;--card:#fff;--line:#e3e6f0;--ok:#0f9d73;--warn:#c2410c;--hot:#e11d48}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

.cs-act{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn.big{font-size:17px;padding:12px 18px;flex:1 1 100%;text-align:center}.cs-box{background:#f8f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}.cs-box.hot{background:#fff4f6;border-color:#ffd0d8}.cs-l{margin:4px 0;padding-left:18px}.cs-l li{margin:3px 0}.cs-out{display:flex;gap:6px;flex-wrap:wrap}

#map{height:360px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px}
.auth{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.auth input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;margin:5px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:80}
details summary{cursor:pointer;color:var(--acc);font-size:13px}.msg{white-space:pre-wrap;font-size:13px;background:#f8f9fc;border-radius:8px;padding:8px;margin-top:6px}

@media(max-width:640px){.bar{padding:8px 10px}main{padding:10px}.sp{display:none}}

<script>

const isHot=c=>!CLOSED.includes(c.status)&&c.status!=='called'&&hotKeys.some(k=>evn(c,k)&&dAgo(evl(c,k))<21)||(c.status==='replied');

function nav(){

}
const byKey=k=>D.companies.find(c=>c.key===k);
function todayLists(){
  const C=D.companies,hot=C.filter(isHot).sort((a,b)=>lastAct(b)-lastAct(a)),hs=new Set(hot.map(c=>c.key));
  const viewed=C.filter(c=>!hs.has(c.key)&&!CLOSED.includes(c.status)&&c.status!=='called'&&evn(c,'pack_view')&&dAgo(evl(c,'pack_view'))<7).sort((a,b)=>ms(evl(b,'pack_view'))-ms(evl(a,'pack_view')));
  const vs=new Set(viewed.map(c=>c.key));
  const opened=C.filter(c=>!hs.has(c.key)&&!vs.has(c.key)&&!CLOSED.includes(c.status)&&evn(c,'email_open')>=2&&dAgo(evl(c,'email_open'))<3&&!evn(c,'email_bounce'));
  const today=new Date().toISOString().slice(0,10);
  const due=C.filter(c=>c.follow_up&&c.follow_up<=today&&!CLOSED.includes(c.status)&&c.status!=='called'&&!hs.has(c.key));
  const waiting=C.filter(c=>c.status==='called').sort((a,b)=>(a.follow_up||'9')<(b.follow_up||'9')?-1:1);
  const drafts=D.drafts.filter(d=>d.status==='draft'&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.to||'')&&!/\[[^\]]*\]/.test(d.body)),failed=D.drafts.filter(d=>d.status==='failed');
  return{hot,waiting,viewed,opened,due,drafts,failed};
}
function why(c){const o=[];if(evn(c,'said_yes'))o.push('tapped yes, call me');if(evn(c,'demo_tap'))o.push('tapped to try the voice demo');if(evn(c,'wants_checkup'))o.push('asked for the check-up');if(evn(c,'phone_left'))o.push('left a number');if(c.status==='replied')o.push('replied');if(evn(c,'pack_view'))o.push('viewed page '+evn(c,'pack_view')+'×');return o.join(' · ')}
function card(c,extra){
  return`<div class="card"><div class="row"><div class="grow"><div class="nm">${esc(c.name)} ${pill(c)}</div><div class="sm">${esc(c.city||'')}${c.rating?' · '+c.rating+'★ ('+(c.reviews||0)+')':''}${extra?' · '+extra:''}</div></div>
${c.phone?`<a class="btn go" href="tel:${esc(c.phone.replace(/[^\d+]/g,''))}">Call ${esc(c.phone)}</a>`:''}<button class="btn" data-open="${esc(c.key)}">Details</button>${c.status!=='called'?`<button class="btn" data-called="${esc(c.key)}">Mark called</button>`:''}</div></div>`;
}
function wire(m){
  m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.open));
  m.querySelectorAll('[data-called]').forEach(b=>b.onclick=async()=>{const r=await sb.from('companies').update({status:'called',updated_at:new Date().toISOString(),updated_by_name:me}).eq('key',b.dataset.called);if(r.error)return toast(r.error.message);toast('Marked called');load()});
}
function vToday(m){
  const t=todayLists(),C=D.companies,sent=C.filter(c=>c.sent>0).length;
  const dl=D.daily[D.daily.length-1]||{};
  let h=`<div class="tiles"><div class="tile"><b>${t.hot.length}</b><span>hot, call now</span></div><div class="tile"><b>${t.viewed.length}</b><span>viewed their page (7d)</span></div><div class="tile"><b>${t.drafts.length}</b><span>emails to send</span></div><div class="tile"><b>${C.filter(c=>c.pending>0).length}</b><span>in follow-up sequence</span></div><div class="tile"><b>${sent}</b><span>businesses contacted</span></div></div>`;

  m.innerHTML=h;wire(m);

function draftRow(d,fail){

/* Pipeline */
function rows(){
  const q=F.q.toLowerCase();let L=D.companies.filter(c=>(!q||(c.name+' '+(c.city||'')+' '+(c.email||'')+' '+(c.phone||'')).toLowerCase().includes(q))&&(!F.stage||stage(c)[0]===F.stage)&&(!F.ind||c.industry===F.ind)&&(!F.city||c.city===F.city));
  const k={name:c=>c.name.toLowerCase(),stage:c=>stage(c)[2],last:lastAct,sent:c=>c.sent,views:c=>evn(c,'pack_view'),opens:c=>evn(c,'email_open')}[F.sort]||lastAct;
  return L.sort((a,b)=>{const x=k(a),y=k(b);return(x>y?1:x<y?-1:0)*F.dir});

function vPipeline(m){

  m.innerHTML=h;const draw=()=>{const L=rows();$('cnt').textContent=L.length+' businesses';
    $('tb').innerHTML=`<table><thead><tr>${[['name','Business'],['stage','Stage'],['sent','Emails'],['opens','Opens'],['views','Page views'],['last','Last activity']].map(x=>`<th data-s="${x[0]}">${x[1]}${F.sort===x[0]?(F.dir>0?' ▲':' ▼'):''}</th>`).join('')}<th>Style</th></tr></thead><tbody>${L.slice(0,400).map(c=>`<tr class="c" data-k="${esc(c.key)}"><td><div class="nm">${esc(c.name)}</div><div class="sm">${esc(c.city||'')}${c.industry?' · '+esc(c.industry):''}</div></td><td>${pill(c)}</td><td>${c.sent}</td><td>${evn(c,'email_open')||''}</td><td>${evn(c,'pack_view')||''}</td><td class="sm">${lastAct(c)?ago(lastAct(c)):''}</td><td class="sm">${esc((c.variant||'')+(c.ss?'/'+c.ss:''))}</td></tr>`).join('')}</tbody></table>`;
    $('tb').querySelectorAll('tr.c').forEach(r=>r.onclick=()=>openDrawer(r.dataset.k));
    $('tb').querySelectorAll('th[data-s]').forEach(t=>t.onclick=()=>{F.dir=F.sort===t.dataset.s?-F.dir:-1;F.sort=t.dataset.s;draw()})};

  $('csv').onclick=()=>{const L=rows(),q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
    const t=['Business,City,Industry,Phone,Email,Stage,Emails sent,Opens,Page views,Yes taps,Demo taps,Style,Subject,Last activity,Page'].concat(L.map(c=>[c.name,c.city,c.industry,c.phone,c.email,stage(c)[0],c.sent,evn(c,'email_open'),evn(c,'pack_view'),evn(c,'said_yes'),evn(c,'demo_tap'),c.variant,c.ss,lastAct(c)?new Date(lastAct(c)).toISOString():'',c.pack_url].map(q).join(','))).join('\n');

function vResults(m){
  const C=D.companies,sent=C.filter(c=>c.sent>0),n=sent.length;
  const step=[['Contacted',sent],['Opened (soft)',sent.filter(c=>evn(c,'email_open')||evn(c,'email_click')||evn(c,'pack_view'))],['Viewed page',sent.filter(c=>evn(c,'pack_view')||evn(c,'wants_checkup'))],['Tried voice demo',sent.filter(c=>evn(c,'demo_tap'))],['Said yes / replied',sent.filter(c=>evn(c,'said_yes')||c.status==='replied'||evn(c,'email_reply'))],['Won',sent.filter(c=>c.status==='won')]];
  let h=`<h2>Where everyone is on the journey</h2><div class="card funnel">${step.map(s=>`<div class="fb"><span>${s[0]}</span><i style="width:${n?Math.max(1,s[1].length/n*100*0.7):1}%"></i><em>${s[1].length} · ${n?Math.round(s[1].length/n*100):0}%</em></div>`).join('')}</div>`;
  const grp=(f)=>{const g={};sent.forEach(c=>{const k=f(c);(g[k]=g[k]||[]).push(c)});return Object.entries(g).sort()};
  const tbl=(title,G)=>`<h2>${title}</h2><div class="tw"><table><thead><tr><th>Group</th><th>Sent</th><th>Viewed page</th><th>Yes / reply</th><th>Voice demo</th><th>Bounced</th></tr></thead><tbody>${G.map(([k,L])=>{const p=x=>x+(L.length?' ('+Math.round(x/L.length*100)+'%)':'');return`<tr><td>${esc(k)}</td><td>${L.length}</td><td>${p(L.filter(c=>evn(c,'pack_view')).length)}</td><td>${p(L.filter(c=>evn(c,'said_yes')||c.status==='replied').length)}</td><td>${p(L.filter(c=>evn(c,'demo_tap')).length)}</td><td>${L.filter(c=>evn(c,'email_bounce')).length}</td></tr>`}).join('')}</tbody></table></div>`;
  const vname={A:'A · check-up link',B:'B · "want me to send it?"',D:'D · voice assistant'};
  h+=tbl('Email style (judge on page views, yes taps and demo taps, not opens)',grp(c=>vname[c.variant]||'Earlier emails (no style tag)'));
  h+=tbl('Subject line',grp(c=>c.ss||'untagged'));
  h+=tbl('By industry',grp(c=>c.industry||'unknown'));
  const dl=D.daily;const mx=Math.max(1,...dl.map(d=>d.first+d.follow));
  h+=`<h2>Last 15 days</h2><div class="card"><div class="bars">${dl.map(d=>`<div title="${d.day}: ${d.first} first emails, ${d.follow} follow-ups" style="height:${(d.first+d.follow)/mx*100}%"></div>`).join('')}</div><div class="sm">Emails sent per day. Hover for numbers.</div></div>`;
  h+=`<div class="tw"><table><thead><tr><th>Day</th><th>First emails</th><th>Follow-ups</th><th>Companies who opened</th><th>Page views</th><th>Yes taps</th><th>Demo taps</th></tr></thead><tbody>${dl.slice().reverse().map(d=>`<tr><td>${d.day}</td><td>${d.first||''}</td><td>${d.follow||''}</td><td>${d.opens||''}</td><td>${d.views||''}</td><td>${d.yes||''}</td><td>${d.demo||''}</td></tr>`).join('')}</tbody></table></div>`;
  m.innerHTML=h;
}

<div class="card" style="margin-top:10px"><div class="bars">${dl.map(d=>`<div class="b2" title="${d.day}: ${d.demo} demo taps" style="height:${d.demo/mx*100}%"></div>`).join('')}</div><div class="sm">Demo taps per day (last 15). A tap means they pressed Call. It can't show who dialed the number directly, or how long they stayed on. For that, check the GrokVoice call log.</div></div>

const ST={Alabama:'AL',Alaska:'AK',Arizona:'AZ',Arkansas:'AR',California:'CA',Colorado:'CO',Connecticut:'CT',Delaware:'DE',Florida:'FL',Georgia:'GA',Hawaii:'HI',Idaho:'ID',Illinois:'IL',Indiana:'IN',Iowa:'IA',Kansas:'KS',Kentucky:'KY',Louisiana:'LA',Maine:'ME',Maryland:'MD',Massachusetts:'MA',Michigan:'MI',Minnesota:'MN',Mississippi:'MS',Missouri:'MO',Montana:'MT',Nebraska:'NE',Nevada:'NV','New Hampshire':'NH','New Jersey':'NJ','New Mexico':'NM','New York':'NY','North Carolina':'NC','North Dakota':'ND',Ohio:'OH',Oklahoma:'OK',Oregon:'OR',Pennsylvania:'PA','Rhode Island':'RI','South Carolina':'SC','South Dakota':'SD',Tennessee:'TN',Texas:'TX',Utah:'UT',Vermont:'VT',Virginia:'VA',Washington:'WA','West Virginia':'WV',Wisconsin:'WI',Wyoming:'WY'};
const IND=['HVAC','Plumbers','Electricians','Roofers','House painters','Landscaping','Lawn care','Tree service','Pool service','Pest control','Carpet cleaning','House cleaning','Window cleaning','Pressure washing','Garage door repair','Handyman','Remodeling contractors','Flooring','Concrete contractors','Fencing','Gutter installation','Solar installers','Appliance repair','Locksmiths','Movers','Junk removal','Auto repair','Auto detailing','Towing','Dentists','Chiropractors','Med spas','Hair salons','Barbers','Dog groomers','Real estate agents','Insurance agents','Accountants','Lawyers','Photographers'];
function vRuns(m){

  m.innerHTML=`<h2>Queue a run</h2><div class="sm" style="margin-bottom:8px">Click the map where you want to look, pick the industry, and queue it. Or type it below.</div><div id="map"></div>
<form class="card row" id="qf"><input id="qc" required placeholder="City, e.g. Mesa, AZ" style="flex:1;min-width:160px;padding:8px;border:1px solid var(--line);border-radius:9px"><input id="qi" required list="il" placeholder="Industry" style="flex:1;min-width:160px;padding:8px;border:1px solid var(--line);border-radius:9px"><datalist id="il">${[...new Set([...D.runs.map(r=>r.niche).filter(Boolean),...IND])].map(x=>`<option>${esc(x)}</option>`).join('')}</datalist><button class="btn p">Add to queue</button></form>
<h2>Queue <span class="n">${pend.length}</span></h2>${rq.length?`<div class="tw"><table><thead><tr><th>Industry</th><th>Area</th><th>Status</th><th>Queued</th></tr></thead><tbody>${rq.map(r=>`<tr><td>${esc(r.industry)}</td><td>${esc(r.city)}</td><td><span class="pill ${r.status==='done'?'ok':'wn'}">${esc(r.status)}</span></td><td class="sm">${ago(r.created)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Queue is empty.</div>'}
${pend.length?`<div class="card" style="margin-top:10px"><b>${pend.length} waiting.</b> Open the Claude chat and say <b>run the que</b>. Claude does the Google Maps pass on your computer, scans the sites, writes the drafts and lists them in Today.</div>`:''}
<h2>Finished runs</h2><div class="tw"><table><thead><tr><th>Run</th><th>Businesses</th><th>Status</th><th>When</th></tr></thead><tbody>${D.runs.map(r=>`<tr><td>${esc(r.title||r.niche+' · '+r.city)}<div class="sm">${esc(r.city||'')}</div></td><td>${r.n}</td><td>${esc(r.status||'')}</td><td class="sm">${ago(r.started)}</td></tr>`).join('')}</tbody></table></div>`;

  initMap();

function initMap(){
  const go=()=>{const el=$('map');if(!el||!window.L)return;const map=L.map(el).setView([33.6,-112.1],6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
    D.runs.forEach(r=>{});
    let pin=null;map.on('click',async e=>{
      if(pin)map.removeLayer(pin);pin=L.marker(e.latlng).addTo(map);
      let name='';try{const c=new AbortController();setTimeout(()=>c.abort(),6000);const j=await(await fetch(`https://photon.komoot.io/reverse?lat=${e.latlng.lat}&lon=${e.latlng.lng}&limit=1&lang=en`,{signal:c.signal})).json();const p=j.features&&j.features[0]&&j.features[0].properties;if(p)name=(p.city||p.name||p.county||'')+(ST[p.state]?', '+ST[p.state]:'')}catch(_){}
      $('qc').value=name||$('qc').value;pin.bindPopup('Area filled in below. Pick the industry and add to queue.').openPopup();
      el.dataset.lat=e.latlng.lat;el.dataset.lng=e.latlng.lng;$('qi').focus()});
    $('qf').addEventListener('submit',()=>{});
    const orig=$('qf').onsubmit;$('qf').onsubmit=async e=>{e.preventDefault();const row={city:$('qc').value.trim(),industry:$('qi').value.trim()};if(el.dataset.lat){row.lat=+el.dataset.lat;row.lng=+el.dataset.lng}const r=await sb.from('run_requests').insert(row);if(r.error)return toast(r.error.message);toast('Queued');load()};
  };
  if(window.L)return go();
  if(!document.getElementById('lfcss')){const l=document.createElement('link');l.id='lfcss';l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l)}
  const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=go;document.head.appendChild(s);
}
/* Company drawer = call sheet */
const stamp=()=>new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'});
const addDays=n=>{const d=new Date(Date.now()+n*864e5);return d.toISOString().slice(0,10)};
const url=u=>u?(/^https?:/i.test(u)?u:'https://'+u):'';
async function openDrawer(key,keep){
  const c=byKey(key);if(!c)return;drawerKey=key;
  const dr=$('dr');if(!keep||!dr.innerHTML)dr.innerHTML=`<div class="drawer"><div class="empty">Loading…</div></div>`;
  const [e,o,f,x]=await Promise.all([
    sb.from('events').select('type,created_at,meta').eq('company_key',key).neq('type','email_delivered').order('created_at',{ascending:false}).limit(60),
    sb.from('outreach').select('id,step,status,subject,sent_at,send_after,variant,subject_style,body,to_address').eq('company_key',key).order('id',{ascending:true}),
    sb.from('findings').select('title,detail').eq('company_key',key).limit(8),
    sb.from('companies').select('website,contact_note,notes,email,phone,call_sheet_url').eq('key',key).maybeSingle()]);
  if(drawerKey!==key)return;
  const x1=x.data||{},site=url(x1.website),notes=x1.notes||c.notes||'',phone=x1.phone||c.phone,email=x1.email||c.email;
  const tel=phone?phone.replace(/[^\d+]/g,''):'';
  const L=[];(e.data||[]).forEach(v=>L.push([v.created_at,v.type.replace(/_/g,' ')+(v.meta&&v.meta.phone?': '+v.meta.phone:'')]));
  const mails=(o.data||[]).filter(v=>v.sent_at),first=(o.data||[]).find(v=>v.step===1);
  mails.forEach(v=>L.push([v.sent_at,'email sent'+(v.step>1?' (follow-up '+(v.step-1)+')':'')+(v.variant?' · style '+v.variant:'')]));
  L.sort((p,q)=>ms(q[0])-ms(p[0]));const sched=(o.data||[]).filter(v=>v.status==='scheduled');
  const finds=(f.data||[]);const did=why(c);
  const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.name+' '+(c.city||''));
  dr.innerHTML=`<div class="drawer">
<div class="row" style="align-items:flex-start"><div class="grow"><h3>${esc(c.name)}</h3><div class="sm">${esc(c.city||'')}${c.industry?' · '+esc(c.industry):''}${c.rating?' · '+c.rating+'★ ('+(c.reviews||0)+' reviews)':''}${c.maps_pos?' · Maps #'+c.maps_pos:''}</div><div style="margin-top:6px">${pill(c)}</div></div><button class="btn" id="dx">Close</button></div>
<div class="cs-act">${tel?`<a class="btn go big" href="tel:${esc(tel)}">📞 Call ${esc(phone)}</a>`:'<span class="sm">No phone number on file</span>'}
${tel?`<a class="btn" href="sms:${esc(tel)}">💬 Text</a>`:''}
${site?`<a class="btn p" target="_blank" rel="noopener" href="${esc(site)}">🌐 Their website</a>`:'<span class="btn" style="opacity:.6">No website on Google listing</span>'}
${x1.call_sheet_url?`<a class="btn p" target="_blank" rel="noopener" href="${esc(x1.call_sheet_url)}">📋 Full call sheet</a>`:''}
${c.pack_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(c.pack_url)}?from=floor">📄 Their check-up page</a>`:''}
<a class="btn" target="_blank" rel="noopener" href="${esc(maps)}">📍 Google listing</a>
${email?`<a class="btn" href="mailto:${esc(email)}">✉️ ${esc(email)}</a>`:''}</div>
${did?`<div class="cs-box hot"><b>What they did:</b> ${esc(did)}</div>`:''}
<div class="cs-box"><b>What to say</b>
<p style="margin:6px 0"><i>“Hi, is this the owner? It’s Tom with 24 Hour AI Solutions. ${c.sent>0?'I sent you a quick note about':'I was looking at'} how ${esc(c.name)} shows up on Google.”</i></p>
${finds.length?`<div class="sm" style="margin-top:6px">What we found:</div><ul class="cs-l">${finds.map(v=>`<li><b>${esc(v.title)}</b>${v.detail?'<br><span class="sm">'+esc(v.detail)+'</span>':''}</li>`).join('')}</ul>`:'<div class="sm">No check-up findings on file.</div>'}
<div class="sm" style="margin-top:6px">Offers:</div><ul class="cs-l"><li>Free preview of a fixed homepage, built in about a day.</li><li>Voice assistant that answers missed calls: they can try it at <b>(469) 779-9037</b>.</li><li>Priced on what their business actually needs.</li></ul>
${x1.contact_note?`<div class="sm" style="margin-top:6px">On file: ${esc(x1.contact_note)}</div>`:''}</div>
<p class="sm" style="margin:14px 0 6px"><b>After the call</b></p>
<div class="cs-out"><button class="btn" data-o="noans">No answer</button><button class="btn" data-o="vm">Left voicemail</button><button class="btn" data-o="wait">Waiting for call back</button><button class="btn go" data-o="int">Interested</button><button class="btn" data-o="meet">Meeting set</button><button class="btn" data-o="no">Not interested</button><button class="btn" data-o="won">Won</button></div>
<div class="row" style="margin-top:8px"><span class="sm">Call back on</span><input type="date" id="dcb" value="${esc(c.follow_up||'')}" style="padding:7px;border:1px solid var(--line);border-radius:9px"><button class="btn" id="dcbs">Set</button></div>
<p class="sm" style="margin:14px 0 4px">Notes (saves when you click away)</p><textarea id="dn" style="min-height:110px">${esc(notes)}</textarea>
<div class="row" style="margin-top:6px"><input id="dq" placeholder="Quick note, e.g. owner is Mike, call after 3pm" style="flex:1;min-width:180px;padding:8px;border:1px solid var(--line);border-radius:9px"><button class="btn" id="dqa">Add note</button></div>
${first?`<details style="margin-top:12px"><summary>The email we sent (${esc(first.subject||'')})</summary><div class="msg">${esc((first.body||'').replace(/\{sender\}/g,'Tom').replace(/\{(\w+)\|([^}]+)\}/g,'[$2]'))}</div></details>`:''}
<p class="sm" style="margin:14px 0 6px">Status</p><div class="row"><select id="ds" style="padding:8px;border:1px solid var(--line);border-radius:9px">${STAT.map(v=>`<option value="${v[0]}" ${c.status===v[0]?'selected':''}>${v[1]}</option>`).join('')}</select>${sched.length?`<button class="btn" id="dstop">Stop ${sched.length} scheduled follow-up${sched.length>1?'s':''}</button>`:''}</div>
<h2 style="font-size:15px">Timeline</h2><ul class="tl">${L.length?L.map(v=>`<li><span>${esc(v[1])}</span><span class="sm">${ago(v[0])}</span></li>`).join(''):'<li class="sm">Nothing yet.</li>'}</ul></div>`;
  const upd=async(patch,msg)=>{const r=await sb.from('companies').update(Object.assign({updated_at:new Date().toISOString(),updated_by_name:me},patch)).eq('key',key);if(r.error)return toast(r.error.message);toast(msg||'Saved');load()};
  const addNote=t=>{const cur=$('dn').value.trim();return (cur?cur+'\n':'')+'['+stamp()+'] '+t};
  $('dx').onclick=()=>{drawerKey=null;dr.innerHTML=''};
  $('ds').onchange=ev=>upd({status:ev.target.value});
  $('dn').onblur=async()=>{if($('dn').value!==notes){const r=await sb.from('companies').update({notes:$('dn').value,updated_at:new Date().toISOString(),updated_by_name:me}).eq('key',key);toast(r.error?r.error.message:'Notes saved')}};
  $('dqa').onclick=()=>{const t=$('dq').value.trim();if(!t)return;upd({notes:addNote(t)},'Note added')};
  $('dcbs').onclick=()=>{const v=$('dcb').value;if(!v)return;upd({follow_up:v},'Call-back set')};
  const stopF=()=>sb.from('outreach').update({status:'cancelled'}).eq('company_key',key).eq('auto',true).eq('status','scheduled');
  dr.querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{const k=b.dataset.o;
    if(k==='noans')return upd({notes:addNote('Called, no answer'),follow_up:addDays(1)},'Logged. Call-back set for tomorrow');
    if(k==='wait')return upd({notes:addNote('Called, they said they will call back'),status:'called',follow_up:addDays(1)},'Logged. Waiting for call back, follow-up set for tomorrow');
    if(k==='vm')return upd({notes:addNote('Left voicemail'),follow_up:addDays(2)},'Logged. Call-back set in 2 days');
    if(k==='int'){await stopF();return upd({notes:addNote('Talked, interested'),status:'replied',follow_up:addDays(1)},'Logged as interested')}
    if(k==='meet'){await stopF();return upd({notes:addNote('Meeting set'),status:'meeting'},'Meeting set')}
    if(k==='no'){await stopF();return upd({notes:addNote('Not interested'),status:'lost'},'Marked not interested')}
    if(k==='won'){await stopF();return upd({notes:addNote('Won'),status:'won'},'Marked won')}});
  const st=$('dstop');if(st)st.onclick=async()=>{const r=await stopF();toast(r.error?r.error.message:'Follow-ups stopped');load()};
}
/* auth */
function signIn(msg){
  $('app').innerHTML=`<form class="auth" id="af"><h2 style="margin:0 0 8px">Sign in</h2><input id="ae" type="email" placeholder="Email" autocomplete="username" required><input id="ap" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn p" style="width:100%;margin-top:6px">Sign in</button><div class="sm" id="am" style="margin-top:8px">${esc(msg||'')}</div></form>`;
  $('af').onsubmit=async e=>{e.preventDefault();$('am').textContent='One moment…';const r=await sb.auth.signInWithPassword({email:$('ae').value.trim(),password:$('ap').value});if(r.error)$('am').textContent=r.error.message};
}
async function boot(){
  const s=(await sb.auth.getSession()).data.session;
  if(!s){admin=false;D=null;return signIn()}
  const a=await sb.from('admins').select('user_id,name').eq('user_id',s.user.id).maybeSingle();
  if(!a.data)return signIn('This account does not have access.');
  admin=true;me=a.data.name||s.user.email.split('@')[0];shell();$('main').innerHTML='<div class="empty">Loading…</div>';load();
}
let last;sb.auth.onAuthStateChange((ev,s)=>{const u=s&&s.user?s.user.id:null;if(u!==last){last=u;setTimeout(boot,0)}});
setInterval(()=>{if(admin&&!document.hidden&&!sending&&!drawerKey&&tab!=='runs'&&document.activeElement.tagName!=='INPUT')load()},60000);
})();
